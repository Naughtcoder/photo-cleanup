name: PhotoCleanup
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  PhotoCleanup:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Photo Cleanup
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: Photo Cleanup scans your library on this device to find screenshots, duplicates and WhatsApp downloads you can delete. Nothing leaves your phone.
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [com.example.photocleanup.scan]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.photocleanup
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
